version: '3.8'

# Python Microservices Droplet
# This runs all Python services on one Droplet with resource limits

networks:
  openride-python:
    driver: bridge

services:
  analytics-service:
    build:
      context: ..
      dockerfile: services/python/analytics-service/Dockerfile
    image: ${REGISTRY:-ghcr.io/davidx345}/openride-analytics-service:${TAG:-latest}
    container_name: analytics-service
    ports:
      - "8097:8097"
    environment:
      - APP_ENV=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT:-6379}/0
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-9000}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - JWT_SECRET_KEY=${JWT_SECRET}
    networks:
      - openride-python
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  driver-service:
    build:
      context: ..
      dockerfile: services/python/driver-service/Dockerfile
    image: ${REGISTRY:-ghcr.io/davidx345}/openride-driver-service:${TAG:-latest}
    container_name: driver-service
    ports:
      - "8090:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT:-6379}/0
      - JWT_SECRET_KEY=${JWT_SECRET}
    networks:
      - openride-python
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fleet-service:
