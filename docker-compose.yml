version: '3.9'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:14-3.3
    container_name: openride-postgres
    environment:
      POSTGRES_DB: openride
      POSTGRES_USER: openride_user
      POSTGRES_PASSWORD: openride_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - openride-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openride_user -d openride"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: openride-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - openride-network
    command: redis-server --appendonly yes --requirepass openride_redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: openride-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - openride-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181", "|", "grep", "imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: openride-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - openride-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Java Services ---

  auth-service:
    build: ./services/java/auth-service
    container_name: openride-auth-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: openride_redis_password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build: ./services/java/user-service
    container_name: openride-user-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build: ./services/java/booking-service
    container_name: openride-booking-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: openride_redis_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payments-service:
    build: ./services/java/payments-service
    container_name: openride-payments-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: openride_redis_password
      KORAPAY_SECRET_KEY: ${KORAPAY_SECRET_KEY}
      KORAPAY_PUBLIC_KEY: ${KORAPAY_PUBLIC_KEY}
      KORAPAY_WEBHOOK_SECRET: ${KORAPAY_WEBHOOK_SECRET}
      PORT: 8084
    ports:
      - "8084:8084"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ticketing-service:
    build: ./services/java/ticketing-service
    container_name: openride-ticketing-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: openride_redis_password
      TICKETING_BLOCKCHAIN_TYPE: POLYGON
      TICKETING_BLOCKCHAIN_RPC_URL: https://rpc-mumbai.maticvigil.com/
      TICKETING_BLOCKCHAIN_PRIVATE_KEY: dummy_key
      TICKETING_BLOCKCHAIN_CONTRACT_ADDRESS: dummy_address
      TICKETING_CRYPTO_AUTO_GENERATE_KEYS: true
      PORT: 8086
    ports:
      - "8086:8086"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payouts-service:
    build: ./services/java/payouts-service
    container_name: openride-payouts-service
    environment:
      DATABASE_URL: ${JDBC_DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PASSWORD: openride_redis_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      PAYSTACK_API_KEY: ${PAYSTACK_API_KEY}
      SERVER_PORT: 8087
    ports:
      - "8087:8087"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  admin-service:
    build: ./services/java/admin-service
    container_name: openride-admin-service
    environment:
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET_KEY}
      SERVER_PORT: 8088
    ports:
      - "8088:8088"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- Python Services ---

  driver-service:
    build: ./services/python/driver-service
    container_name: openride-driver-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      USER_SERVICE_URL: http://user-service:8082/api
    ports:
      - "8091:8000"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  matchmaking-service:
    build: ./services/python/matchmaking-service
    container_name: openride-matchmaking-service
    environment:
      SERVICE_PORT: 8092
      SECRET_KEY: ${JWT_SECRET_KEY}
      DRIVER_SERVICE_URL: http://driver-service:8000/v1
    ports:
      - "8092:8092"
    networks:
      - openride-network
    depends_on:
      driver-service:
        condition: service_started

  search-service:
    build: ./services/python/search-service
    container_name: openride-search-service
    environment:
      SERVICE_PORT: 8085
      MATCHMAKING_SERVICE_URL: http://matchmaking-service:8092/v1
    ports:
      - "8093:8085"
    networks:
      - openride-network
    depends_on:
      matchmaking-service:
        condition: service_started

  notification-service:
    build: ./services/python/notification-service
    container_name: openride-notification-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: redis://:openride_redis_password@redis:6379/4
      CELERY_RESULT_BACKEND: redis://:openride_redis_password@redis:6379/5
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8095
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    ports:
      - "8095:8095"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fleet-service:
    build: ./services/python/fleet-service
    container_name: openride-fleet-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: openride_redis_password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8096
    ports:
      - "8096:8096"
      - "9096:9096"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build: ./services/python/analytics-service
    container_name: openride-analytics-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: openride_analytics
      REDIS_URL: redis://:openride_redis_password@redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      LOG_LEVEL: INFO
    ports:
      - "8097:8097"
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: openride-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/python/analytics-service/clickhouse:/docker-entrypoint-initdb.d
    networks:
      - openride-network
    environment:
      CLICKHOUSE_DB: openride_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openride-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@openride.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - openride-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  openride-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  ticketing_keys:
  clickhouse_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
