spring:
  application:
    name: user-service
  
  datasource:
    # prepareThreshold=0 required for Supabase/PgBouncer transaction pooling
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/openride?prepareThreshold=0}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

server:
  port: ${PORT:8082}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.openride.user: ${LOG_LEVEL:DEBUG}
    org.springframework.security: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"

# Application-specific settings
openride:
  security:
    jwt:
      secret: ${JWT_SECRET_KEY:your-secret-key-change-in-production-min-256-bits}
    encryption:
      key: ${ENCRYPTION_KEY:your-32-char-encryption-key!!}  # AES-256 requires 32 bytes
      algorithm: AES/GCM/NoPadding
  
  # Dojah KYC verification service
  dojah:
    app-id: ${DOJAH_APP_ID:test-app-id}
    secret-key: ${DOJAH_SECRET_KEY:test-secret-key}
    base-url: ${DOJAH_BASE_URL:https://api.dojah.io}
    test-mode: ${DOJAH_TEST_MODE:true}
  
  # Email service for affiliation verification
  email:
    from: ${EMAIL_FROM:noreply@openride.ng}
    verification-url: ${VERIFICATION_BASE_URL:https://app.openride.ng/verify-email}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
